name: apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: apply-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Cloud step. Stubbed. ./check.sh does not call AWS.
      # - name: Assume the apply role
      #   uses: aws-actions/configure-aws-credentials@v6.3.0
      #   with:
      #     role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
      #     aws-region: us-east-1
      #     role-session-name: terragrunt-apply
      - name: Apply
        run: ./scripts/apply.sh
