name: plan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Cloud step. Stubbed. ./check.sh does not call AWS.
