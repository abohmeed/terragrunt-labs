# Course pins, locked 2026-11-01.
# A prefix: request installs the newest patch on that minor line:
#   Terragrunt ~> 1.2
#   Terraform  1.17.x
#   OpenTofu   1.13.x (add-on section; installed so those labs are ready)

[tools]
terragrunt = "prefix:1.2"
terraform = "prefix:1.17"
opentofu = "prefix:1.13"

# Lecture 08.2 pins tflint. The checker installs this release when the
# binary is missing. sops and age stay commented until lecture 09.1.
tflint = "0.65.0"
